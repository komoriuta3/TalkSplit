<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkSplit A/B Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#202124;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:#202938;color:#fff;padding:14px 16px}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.75}
main{max-width:850px;margin:auto;padding:12px 12px 100px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;border:0;border-radius:9px;padding:10px 13px;background:#fff;box-shadow:0 1px 3px #0002}button{cursor:pointer}
button.primary{background:#2563eb;color:#fff}button.stop{background:#555;color:#fff}button:disabled{opacity:.45}
#status{background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
#chat{display:flex;flex-direction:column;gap:9px}.row{display:flex}.row.a{justify-content:flex-start}.row.b{justify-content:flex-end}
.bubble{max-width:82%;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 1px 3px #0001}
.a .bubble{border-bottom-left-radius:3px}.b .bubble{border-bottom-right-radius:3px}
.who{font-size:11px;font-weight:700;margin-bottom:3px;opacity:.65}.text{white-space:pre-wrap;line-height:1.55}
.edit{margin-top:7px;display:none;width:100%;min-height:65px;border:1px solid #ddd;border-radius:8px;padding:7px;font:inherit}
.actions{display:flex;gap:5px;margin-top:7px}.actions button{font-size:11px;padding:5px 7px;box-shadow:none}
.empty{text-align:center;color:#8a919a;padding:100px 20px;background:#fff;border-radius:14px}
.help{font-size:12px;color:#666;line-height:1.6;margin-top:12px}
</style></head>
<body>
<header><h1>TalkSplit</h1><div class="sub">二人の会話をA/Bチャットに変換する試作版</div></header>
<main>
<div class="toolbar">
<button id="start" class="primary">● 会話開始</button>
<button id="stop" class="stop" disabled>■ 停止</button>
<select id="speakerMode"><option value="auto">話者推定：自動</option><option value="a">現在の話者：A</option><option value="b">現在の話者：B</option></select>
<button id="clear">消去</button><button id="save">TXT保存</button>
</div>
<div id="status">待機中</div>
<div id="chat"><div class="empty">「会話開始」を押して、二人で話してください。</div></div>
<div class="help">現在の話者推定は、音声そのものを解析する本格的な話者ダイアライゼーションではありません。発話単位と会話順序を利用した簡易推定です。各吹き出しの「A/B変更」で訂正できます。</div>
</main>
<script>
(()=>{"use strict";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const start=document.getElementById("start"),stop=document.getElementById("stop"),mode=document.getElementById("speakerMode"),clear=document.getElementById("clear"),save=document.getElementById("save"),status=document.getElementById("status"),chat=document.getElementById("chat");
let rec=null,running=false,turns=[],nextSpeaker="a",interimEl=null;
function setStatus(t){status.textContent=t}
function render(){
 chat.innerHTML="";
 if(!turns.length){chat.innerHTML='<div class="empty">「会話開始」を押して、二人で話してください。</div>';return}
 turns.forEach((turn,index)=>{
  const row=document.createElement("div");row.className="row "+turn.speaker;
  const bubble=document.createElement("div");bubble.className="bubble";
  const who=document.createElement("div");who.className="who";who.textContent="話者 "+turn.speaker.toUpperCase();
  const text=document.createElement("div");text.className="text";text.textContent=turn.text;
  const edit=document.createElement("textarea");edit.className="edit";edit.value=turn.text;
  const actions=document.createElement("div");actions.className="actions";
  const change=document.createElement("button");change.textContent=turn.speaker==="a"?"→ Bに変更":"→ Aに変更";change.onclick=()=>{turn.speaker=turn.speaker==="a"?"b":"a";render()};
  const editBtn=document.createElement("button");editBtn.textContent="文章を編集";editBtn.onclick=()=>{edit.style.display=edit.style.display==="block"?"none":"block"};
  const saveBtn=document.createElement("button");saveBtn.textContent="編集を確定";saveBtn.onclick=()=>{turn.text=edit.value.trim();render()};
  actions.append(change,editBtn,saveBtn);bubble.append(who,text,edit,actions);row.appendChild(bubble);chat.appendChild(row);
 });
}
function chooseSpeaker(){if(mode.value==="a")return"a";if(mode.value==="b")return"b";const s=nextSpeaker;nextSpeaker=s==="a"?"b":"a";return s}
function addTurn(text){text=text.trim();if(!text)return;turns.push({speaker:chooseSpeaker(),text});render()}
function setup(){
 rec=new SR();rec.lang="ja-JP";rec.continuous=true;rec.interimResults=true;
 rec.onstart=()=>{running=true;start.disabled=true;stop.disabled=false;setStatus("認識中。二人で自然に会話してください。")};
 rec.onresult=(event)=>{
  let finalText="",interimText="";
  for(let i=event.resultIndex;i<event.results.length;i++){const t=event.results[i][0].transcript;if(event.results[i].isFinal)finalText+=t;else interimText+=t}
  if(interimEl){interimEl.remove();interimEl=null}
  if(finalText)addTurn(finalText);
  if(interimText){interimEl=document.createElement("div");interimEl.className="row "+nextSpeaker;const b=document.createElement("div");b.className="bubble";b.style.opacity=".5";b.textContent=interimText;interimEl.appendChild(b);chat.appendChild(interimEl);chat.scrollTop=chat.scrollHeight}
 };
 rec.onerror=e=>setStatus("音声認識エラー："+e.error);
 rec.onend=()=>{if(running){try{rec.start()}catch(e){}}else{start.disabled=false;stop.disabled=true;setStatus("停止しました。")}};
}
start.onclick=async()=>{
 if(!SR){setStatus("このChromeでは音声認識APIを利用できません。");return}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}
 catch(e){setStatus("マイクを利用できません："+e.name+"。Android Chromeのマイク権限を確認してください。");return}
 if(!rec)setup();running=true;try{rec.start()}catch(e){setStatus("開始できません："+e.message)}
};
stop.onclick=()=>{running=false;if(rec)try{rec.stop()}catch(e){}};
clear.onclick=()=>{turns=[];nextSpeaker="a";render();setStatus("会話を消去しました。")};
save.onclick=()=>{if(!turns.length)return;const txt=turns.map(t=>"話者 "+t.speaker.toUpperCase()+": "+t.text).join("\n");const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="talksplit_conversation.txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
render();
})();
</script></body></html>
